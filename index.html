<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Registro personal de entrenamiento para Classic Physique">
  <title>Classic Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <div id="rest" class="rest hidden" role="timer" aria-label="Descanso"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="hoy" class="active">Hoy</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="progreso">Progreso</button>
    <button data-tab="yo">Yo</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
